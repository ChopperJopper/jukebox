<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Køb credits - Jukebox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="overstediv">
        <button id="homebutton" onclick="window.location.href='index.html'">
        <svg class="logo-ikon" viewBox="0 0 32 40" width="32" height="40">
        <rect x="0"  y="10" width="5" height="20" rx="2.5"></rect>
        <rect x="9"  y="2"  width="5" height="36" rx="2.5"></rect>
        <rect x="18" y="12" width="5" height="16" rx="2.5"></rect>
        <rect x="27" y="6"  width="5" height="28" rx="2.5"></rect>
        </svg>
        <span>jukebox</span>
        </button>

        <input id="search" type="search" placeholder="søg efter en sang her">

        <div class="creditinfo">
            <p class="creditcount">0</p>

            <button class="credits_icon" onclick="window.location.href='credits.html'">
                <img src="icons/png/layers.png" alt="Credits">
            </button>
        </div>
    </div>

    <div class="maindiv">
        <h1>Køb credits</h1>
        <p>Vælg den credit-pakke, du ønsker:</p>

        <div class="creditpakker">
            <button onclick="selectcredits(1)">
                <h2>1 credit</h2>
                <p>2 kr.</p>
            </button>

            <button onclick="selectcredits(3)">
                <h2>3 credits</h2>
                <p>5 kr.</p>
            </button>
        </div>

        <button onclick="window.location.href='index.html'">
            Tilbage til Jukebox
        </button>
    </div>

    <div id="sidebar">
        <img src="vinyl-album.png" class="albumcover">
        <p id="sangtitel">sangtitel</p>
        <progress value="50" max="100"></progress>
    </div>

    <div id="kø">
        <list class="que">kø</list>
    </div>

    <!-- POPUP MED BETALINGSMETODER -->
    <div id="paymentPopup" class="popup">
        <div class="popup-content" id="paymentOptions">
            <h2>Vælg betalingsmetode</h2>
            <button onclick="buycredits('MobilePay')">MobilePay</button>
            <button onclick="buycredits('Betalingskort')">Betalingskort</button>
            <button onclick="buycredits('Betal oppe i baren')">Betal oppe i baren</button>
            <button onclick="closePopup()">Annuller</button>
        </div>

        <!-- POPUP NÅR KØBET ER GENNEMFØRT -->
        <div class="popup-content" id="purchaseSuccess" style="display: none;">
            <h2>Køb gennemført!</h2>
            <p id="successMessage"></p>
            <button onclick="closePopup()">Fortsæt</button>
        </div>
    </div>

    <script src="credit.js"></script>
    <script>
        updateCreditCount();
    </script>
</body>
</html>
