<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="overstediv">
    
        <button id="homebutton" onclick="window.location.href='index.html'">
            <svg class="logo-ikon" viewBox="0 0 32 40" width="32" height="40">
            <rect x="0"  y="10" width="5" height="20" rx="2.5"></rect>
            <rect x="9"  y="2"  width="5" height="36" rx="2.5"></rect>
            <rect x="18" y="12" width="5" height="16" rx="2.5"></rect>
            <rect x="27" y="6"  width="5" height="28" rx="2.5"></rect>
            </svg>
            <span>jukebox</span>
        </button>
    
        <input id="search" type="search" placeholder="søg efter en sang her">
    
        <div class="creditinfo">
            <p class="creditcount">0</p>
            <!-- displays the user's current credit balance -->
            <button class="credits_icon" onclick="window.location.href='credits.html'">
                <img src="coin-money-svgrepo-com.svg" alt="Credits" height="30" width="30">
                <!-- lets the user add to their credit balance -->
            </button>
        </div>
    </div>
    <div class="maindiv">
        <div id="search_results" hidden>
            <div class="search_by">
                <h3>Songs</h3>
                <ul id="track_list">
                </ul>
            </div>
        </div>

            <div class="titel-raekke">
            <h1 class="titel">Skal din sang på?<br>Køb dine credits her.</h1>
            <button id="credits2" class="creditsknap" onclick="window.location.href='credits.html'">
            <p>Køb credits →</p>
        </div>

        </button>
       
    </div>

    <div>
        <div id="sidebar">
            <img src="vinyl-album.png" class="albumcover">
            <p id="sangtitel">sangtitel</p>
        </div>

        <div id="kø">
            <h3>Kø</h3>
            <ul id="queue_list"></ul>
        </div>
    </div>
</body>

<script>
    let credits = localStorage.getItem("credits") || 0;

    document.querySelector(".creditcount").textContent = credits;
</script>
<script src="credits.js"></script>

<script src="script.js"></script>

<script>
    updateCreditCount();
</script>
</body>
</html>
